<title>Что придёт в Telegram</title>
<style>
:root{
  --ink:#141a24; --ink-2:#4a5768; --ink-3:#7d8899;
  --bg:#f4f6f9; --card:#ffffff; --line:#dfe4ec;
  --brand:#1f5fa8; --amber:#9a6300; --amber-bg:#fdf3df;
  --tg:#eef2f7; --tg-ink:#141a24;
  --ok:#1a7f4b; --red:#c0392f; --alarm:#a8321c; --info:#3d6ea8;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e7ecf3; --ink-2:#a3b0c2; --ink-3:#76839a;
    --bg:#0d1219; --card:#141b25; --line:#252f3d;
    --brand:#7db3ee; --amber:#e0a53c; --amber-bg:#2a2113;
    --tg:#1b2431; --tg-ink:#e7ecf3;
    --ok:#4ec98a; --red:#f0776b; --alarm:#ff8a6a; --info:#8ab6ea;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ecf3; --ink-2:#a3b0c2; --ink-3:#76839a;
  --bg:#0d1219; --card:#141b25; --line:#252f3d;
  --brand:#7db3ee; --amber:#e0a53c; --amber-bg:#2a2113;
  --tg:#1b2431; --tg-ink:#e7ecf3;
  --ok:#4ec98a; --red:#f0776b; --alarm:#ff8a6a; --info:#8ab6ea;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding:56px 24px 96px; display:flex; flex-direction:column; gap:40px}

.lede h1{
  font-size:clamp(28px,4.2vw,44px); line-height:1.12; margin:0 0 14px;
  font-weight:600; letter-spacing:-.02em; text-wrap:balance;
}
.lede p{margin:0 0 10px; color:var(--ink-2); max-width:62ch}
.lede .meta{font-size:14px; color:var(--ink-3)}
code{font-family:var(--mono); font-size:.88em; background:var(--tg); padding:1px 5px; border-radius:4px}

nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:2px 18px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:16px 0}
nav a{color:var(--ink-2); text-decoration:none; font-size:14px; padding:3px 0;
      display:flex; gap:9px; align-items:baseline}
nav a b{font-family:var(--mono); font-size:12px; color:var(--ink-3); font-weight:500;
        font-variant-numeric:tabular-nums}
nav a:hover{color:var(--brand)}
nav a:hover b{color:var(--brand)}

section.block{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px 26px 28px}
section.block h2{margin:0 0 8px; font-size:21px; font-weight:600; letter-spacing:-.01em}
section.block > p{margin:0 0 18px; color:var(--ink-2); max-width:70ch}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:640px}
th,td{text-align:left; padding:9px 14px 9px 0; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:600}
td:first-child{white-space:nowrap}
td:first-child small{display:block; white-space:normal; margin-top:4px; color:var(--ink-3); font-size:12.5px; max-width:22ch}
.l2{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:3px 0}
.l2 code{background:var(--tg); font-size:12.5px; white-space:nowrap}
.l2 i{color:var(--ink-3); font-size:13px; font-style:normal}
.l2 b{font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--ink-3);
      border:1px solid var(--line); border-radius:20px; padding:1px 8px; white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px}
.rules li{padding-left:0}
.rules b{display:block; font-size:14px; font-weight:600; margin-bottom:2px}
.rules span{color:var(--ink-2); font-size:14.5px}

article{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
article header{padding:22px 26px 18px; border-bottom:1px solid var(--line); position:relative}
article header .no{position:absolute; top:24px; right:26px; margin:0;
  font-family:var(--mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
article h2{margin:0 0 14px; font-size:21px; font-weight:600; letter-spacing:-.01em; padding-right:40px}
article dl{margin:0; display:flex; flex-wrap:wrap; gap:6px 30px; font-size:14px}
article dl div{display:flex; gap:8px; align-items:baseline}
article dt{color:var(--ink-3); font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:600}
article dd{margin:0; color:var(--ink-2)}
.live.live{font-weight:600}
.live.on,.live.live{color:var(--ok)} .live.off{color:var(--red)} .live.new{color:var(--amber)}

.panes{display:grid; grid-template-columns:1fr}
.pane{padding:22px 26px 26px; min-width:0}
.pane.only{grid-column:1 / -1; max-width:620px}
.pane h3{margin:0 0 14px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
         color:var(--ink-3); font-weight:600}

.bubble{background:var(--tg); color:var(--tg-ink); border-radius:12px; padding:13px 16px;
        border-left:3px solid var(--info); overflow-x:auto}
.bubble.ok{border-left-color:var(--ok)} .bubble.red{border-left-color:var(--red)}
.bubble.alarm{border-left-color:var(--alarm)} .bubble.info{border-left-color:var(--info)}
.bubble.wait{border-left-color:var(--amber)}
table.icons td.ic{font-size:20px;text-align:center;width:1%;white-space:nowrap}
table.icons td:last-child{white-space:nowrap;color:var(--ink-3)}
.tags{margin:0 0 9px; display:flex; flex-wrap:wrap; gap:6px}
.tags .notag{font-style:italic; background:none; padding:2px 0; color:var(--ink-3)}
.tags span{font-family:var(--mono); font-size:11.5px; color:var(--ink-3);
           background:color-mix(in srgb, var(--ink-3) 12%, transparent);
           padding:2px 7px; border-radius:5px}
.msg{font-family:var(--mono); font-size:13.5px; line-height:1.62; word-break:break-word}
.msg a{color:var(--brand)}
.msg code{background:color-mix(in srgb, var(--ink-3) 14%, transparent)}
.msg .q{display:block; margin:7px 0; padding-left:11px;
        border-left:2px solid color-mix(in srgb, var(--ink-3) 45%, transparent); color:var(--ink-2)}

.delta{margin:0; padding:16px 26px 20px; border-top:1px solid var(--line);
       font-size:14.5px; color:var(--ink-2); background:color-mix(in srgb, var(--amber-bg) 55%, transparent)}
.delta span{display:inline-block; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  font-weight:700; color:var(--amber); border:1px solid currentColor; border-radius:20px;
  padding:2px 9px; margin-right:11px; vertical-align:1px}

footer{color:var(--ink-3); font-size:13.5px; border-top:1px solid var(--line); padding-top:22px}
footer p{margin:0 0 6px; max-width:70ch}

@media (max-width:760px){
  .wrap{padding:36px 16px 72px}
  .pane{padding:18px 18px 22px}
  article header{padding:18px 18px 16px}
  section.block{padding:20px 18px 22px}
  .delta{padding:14px 18px 18px}
}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
