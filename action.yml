name: notify
description: Отправить типизированное Telegram-уведомление (форум-тема + при необходимости incidents/команда)
author: mikitasazan

inputs:
  event:
    description: Тип события — deploy, job, report, ci, pr, issue, incident, heartbeat_miss
    required: true
  project:
    description: playhub, one-q, arvent или game-publisher
    required: true
  status:
    description: 'ok/fail (для deploy, job, ci) — обычно передают статус джобы (job.status); success/failure маппится автоматически'
    required: false
  commit:
    required: false
  commit-url:
    description: 'Ссылка на коммит — по умолчанию тот, на котором запущен workflow'
    default: '${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}'
    required: false
  url:
    required: false
  target:
    description: Куда выкатили — заполнять только там, где окружений больше одного
    required: false
  via:
    description: Откуда запустили — «GitHub Actions», «вручную с Mac»
    required: false
  job-name:
    description: Имя задачи (для job/heartbeat_miss) — CLI-флаг --job
    required: false
  key:
    description: 'Машинный ключ экземпляра — тег карточки и то, по чему разборщик находит пару «сломалось → починилось». Без него ключ строится из имени задачи и рвётся при переименовании.'
    required: false
  note:
    required: false
  title:
    required: false
  period:
    required: false
  branch:
    description: 'По умолчанию — имя ветки (github.ref_name)'
    required: false
  actor:
    description: 'По умолчанию — инициатор (github.actor)'
    required: false
  action:
    description: opened/review_requested/merged (для pr)
    required: false
  number:
    required: false
  author:
    required: false
  reviewer:
    required: false
  assignee:
    required: false
  detail:
    required: false
  stats:
    description: 'Цифры для job — по строке на «метка=значение» (многострочный вход)'
    required: false
  lines:
    description: 'Цифры для report — по строке на «метка=значение» (многострочный вход)'
    required: false
  items:
    description: 'Позиции списка — по строке на «текст» или «текст|ссылка» (многострочный вход)'
    required: false
  commit-title:
    description: 'Заголовок коммита (subject) — по умолчанию первая строка github.event.head_commit.message'
    default: ${{ github.event.head_commit.message }}
    required: false
  commit-body:
    required: false
  workflow-url:
    description: 'Ссылка на прогон — по умолчанию текущий'
    default: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    required: false
  workflow-name:
    description: 'По умолчанию — имя текущего workflow'
    default: ${{ github.workflow }}
    required: false
  body:
    description: 'Тело issue/PR (для issue) — по умолчанию github.event.issue.body / github.event.pull_request.body'
    default: ${{ github.event.issue.body || github.event.pull_request.body }}
    required: false
  logs:
    description: 'Локальный путь к логам (для incident) — не ссылка, моноширинным для копирования'
    required: false
  recovered:
    description: '"true" — задача снова отчиталась (heartbeat_miss рисуется зелёным)'
    required: false

runs:
  using: composite
  steps:
    # Node 24 из кеша раннера, ~1с. Нативно исполняет .ts без сборки —
    # зависимостей у пакета нет, ставить нечего.
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    # ВСЕ входы приходят ТОЛЬКО через env, никогда через ${{ }} внутри run.
    # Причина не стилистическая: GitHub подставляет ${{ }} в текст скрипта ДО
    # запуска bash. Коммит с апострофом («don't crash») ломал шаг синтаксической
    # ошибкой, а `$(...)` в заголовке PR выполнялся бы на раннере — там, где
    # лежит OPS_BOT_TOKEN. Через env значения остаются данными.
    - shell: bash
      env:
        IN_EVENT: ${{ inputs.event }}
        IN_PROJECT: ${{ inputs.project }}
        IN_STATUS: ${{ inputs.status }}
        IN_COMMIT: ${{ inputs.commit }}
        IN_COMMIT_URL: ${{ inputs.commit-url }}
        IN_URL: ${{ inputs.url }}
        IN_TARGET: ${{ inputs.target }}
        IN_VIA: ${{ inputs.via }}
        IN_JOB: ${{ inputs.job-name }}
        IN_KEY: ${{ inputs.key }}
        IN_NOTE: ${{ inputs.note }}
        IN_TITLE: ${{ inputs.title }}
        IN_PERIOD: ${{ inputs.period }}
        IN_ACTION: ${{ inputs.action }}
        IN_NUMBER: ${{ inputs.number }}
        IN_AUTHOR: ${{ inputs.author }}
        IN_REVIEWER: ${{ inputs.reviewer }}
        IN_ASSIGNEE: ${{ inputs.assignee }}
        IN_DETAIL: ${{ inputs.detail }}
        IN_STATS: ${{ inputs.stats }}
        IN_LINES: ${{ inputs.lines }}
        IN_ITEMS: ${{ inputs.items }}
        IN_BRANCH: ${{ inputs.branch }}
        IN_ACTOR: ${{ inputs.actor }}
        IN_COMMIT_TITLE: ${{ inputs.commit-title }}
        IN_COMMIT_BODY: ${{ inputs.commit-body }}
        IN_WORKFLOW_URL: ${{ inputs.workflow-url }}
        IN_WORKFLOW_NAME: ${{ inputs.workflow-name }}
        IN_BODY: ${{ inputs.body }}
        IN_LOGS: ${{ inputs.logs }}
        IN_RECOVERED: ${{ inputs.recovered }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_ACTOR: ${{ github.actor }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail

        ARGS=(--project "$IN_PROJECT")

        # job.status отдаёт success/failure — приводим к ok/fail, которые
        # понимает пакет. Нормализация здесь дублирует CLI намеренно: так
        # 'status: job.status' работает без обёрток в каждом workflow.
        if [ -n "$IN_STATUS" ]; then
          case "$IN_STATUS" in
            success|ok) ARGS+=(--status ok) ;;
            # `disabled` passes through instead of collapsing to `fail`: a job
            # switched off from outside did not fail on its own, and the package
            # draws it its own way. Rewriting it here made the third state
            # unreachable from any workflow.
            disabled)   ARGS+=(--status disabled) ;;
            *)          ARGS+=(--status fail) ;;
          esac
        fi

        # `--flag=value`, never `--flag value`: the CLI rejects a value that
        # starts with two dashes, so an issue body or commit body beginning with
        # `---` (ordinary markdown) killed the whole card — silently, because the
        # CLI always exits 0.
        add() { [ -n "$2" ] && ARGS+=("$1=$2"); return 0; }
        add --commit   "$IN_COMMIT"
        add --commit-url "$IN_COMMIT_URL"
        add --url      "$IN_URL"
        add --target   "$IN_TARGET"
        add --via      "$IN_VIA"
        add --job      "$IN_JOB"
        add --key      "$IN_KEY"
        add --note     "$IN_NOTE"
        add --title    "$IN_TITLE"
        add --period   "$IN_PERIOD"
        add --action   "$IN_ACTION"
        add --number   "$IN_NUMBER"
        add --author   "$IN_AUTHOR"
        add --reviewer "$IN_REVIEWER"
        add --assignee "$IN_ASSIGNEE"
        add --detail   "$IN_DETAIL"
        add --workflow-url  "$IN_WORKFLOW_URL"
        add --workflow-name "$IN_WORKFLOW_NAME"
        add --body     "$IN_BODY"
        add --logs     "$IN_LOGS"
        [ "$IN_RECOVERED" = "true" ] && ARGS+=(--recovered)

        # github.event.head_commit.message несёт subject+body одним
        # многострочным полем — commit-title/commit-body у пакета раздельные.
        # Явный --commit-body побеждает; без него режем head_commit.message
        # по первому переводу строки.
        if [ -n "$IN_COMMIT_BODY" ]; then
          add --commit-title "$IN_COMMIT_TITLE"
          add --commit-body  "$IN_COMMIT_BODY"
        elif [ -n "$IN_COMMIT_TITLE" ]; then
          add --commit-title "${IN_COMMIT_TITLE%%$'\n'*}"
          BODY_TAIL="${IN_COMMIT_TITLE#*$'\n'}"
          [ "$BODY_TAIL" != "$IN_COMMIT_TITLE" ] && add --commit-body "$(printf '%s' "$BODY_TAIL" | sed '/./,$!d')"
        fi

        # Многострочные входы: по строке на значение. Раньше здесь читался
        # `inputs.stats`, которого НЕ БЫЛО в объявлении входов выше — значит он
        # всегда приходил пустым, а вызывающий workflow вдобавок получал
        # предупреждение «Unexpected input». Через action нельзя было послать ни
        # job с цифрами, ни report вообще (у него все данные в --line).
        repeat() { # $1 = флаг, $2 = многострочное значение
          while IFS= read -r line; do
            [ -n "$line" ] && ARGS+=("$1=$line")
          done <<< "$2"
          return 0
        }
        repeat --stat "$IN_STATS"
        repeat --line "$IN_LINES"
        repeat --item "$IN_ITEMS"

        if [ "$IN_EVENT" = "ci" ]; then
          ARGS+=("--branch=${IN_BRANCH:-$GH_REF_NAME}" "--actor=${IN_ACTOR:-$GH_ACTOR}")
        fi

        # The `commit:` field is the IDENTIFIER — a short hash that links to the
        # commit. The human text belongs in the quote below it, which
        # commit-title/commit-body already fill. Without this default every
        # caller had to build the hash itself, and not one of them did: they put
        # the subject there instead, so the card repeated the same line twice
        # and the hash was nowhere. `${GITHUB_SHA:0:7}` needs bash — GitHub
        # expressions have no substring function, so it cannot be an input
        # `default:`.
        case "$IN_EVENT" in
          deploy|ci) [ -z "$IN_COMMIT" ] && [ -n "$GITHUB_SHA" ] \
            && ARGS+=("--commit=${GITHUB_SHA:0:7}") ;;
        esac

        OUT=$(node "$ACTION_PATH/src/cli.ts" "$IN_EVENT" "${ARGS[@]}" 2>&1) || true
        printf '%s\n' "$OUT"

        # Молчаливо потерянное уведомление — худший исход: workflow зелёный,
        # а сообщения нет. Жёлтая аннотация видна в UI и не валит прогон.
        case "$OUT" in
          *failed*|*skipped*) echo "::warning::уведомление не доставлено: $OUT" ;;
        esac
